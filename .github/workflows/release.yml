name: Release

# Label-driven npm release.
#
# Open PRs with `/pr <patch|minor|major>`, which labels the PR `npm:patch`,
# `npm:minor`, or `npm:major`. When such a PR is **merged** into `main`, this
# workflow reads the label, bumps the version in package.json, updates
# CHANGELOG.md, commits + tags the new version on main, creates the GitHub
# Release (with source archives), and publishes to npm.
#
# `workflow_dispatch` is a manual fallback that bumps + releases using the
# `bump` input. Already-tagged versions are skipped, so re-runs are no-ops.
#
# Requires the NPM_TOKEN secret (npm automation token authorized for the
# @kolisachint scope) and the RELEASE_PAT secret (push commit/tag + create release).

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run for a merged PR carrying an npm:* label, or a manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
        (contains(github.event.pull_request.labels.*.name, 'npm:patch') ||
         contains(github.event.pull_request.labels.*.name, 'npm:minor') ||
         contains(github.event.pull_request.labels.*.name, 'npm:major')))
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_PAT }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Resolve bump type
        id: bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bump="$INPUT_BUMP"
          elif echo "$LABELS" | grep -q '"npm:major"'; then
            bump="major"
          elif echo "$LABELS" | grep -q '"npm:minor"'; then
            bump="minor"
          else
            bump="patch"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Resolved bump: $bump"

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun test

      - name: Bump version
        id: version
        run: |
          npm version "${{ steps.bump.outputs.bump }}" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "New version: $version"

      - name: Skip if this version is already released
        id: check
        run: |
          git fetch --tags --force >/dev/null 2>&1 || true
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "v${{ steps.version.outputs.version }} already tagged — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update CHANGELOG
        if: steps.check.outputs.release == 'true'
        run: bun x conventional-changelog-cli -p conventionalcommits -i CHANGELOG.md -s

      - name: Commit version bump
        if: steps.check.outputs.release == 'true'
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git push origin main

      - name: Tag
        if: steps.check.outputs.release == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check.outputs.release == 'true'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "HooCowork v${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Publish to npm
        if: steps.check.outputs.release == 'true'
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
